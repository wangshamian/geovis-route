<script>
// ---------- 高德 GCJ-02 与 WGS84 互转（ORS 数据是 WGS84，高德瓦片是 GCJ-02） ----------
const PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;

function outOfChina(lat, lng) {
  return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
}
function transformLat(x, y) {
  let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLng(x, y) {
  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
  return ret;
}
function wgs84ToGcj02(lat, lng) {
  if (outOfChina(lat, lng)) return [lat, lng];
  let dLat = transformLat(lng - 105.0, lat - 35.0);
  let dLng = transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * PI;
  let magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
  return [lat + dLat, lng + dLng];
}
function gcj02ToWgs84(lat, lng) {
  if (outOfChina(lat, lng)) return [lat, lng];
  let wgsLat = lat, wgsLng = lng;
  for (let i = 0; i < 5; i++) {
    const g = wgs84ToGcj02(wgsLat, wgsLng);
    wgsLat -= g[0] - lat;
    wgsLng -= g[1] - lng;
  }
  return [wgsLat, wgsLng];
}

// ---------- ORS 编码 polyline 解码（precision=5） ----------
function decodePolyline(str, precision) {
  const factor = Math.pow(10, precision || 5);
  let index = 0, lat = 0, lng = 0;
  const coordinates = [];
  while (index < str.length) {
    let byte = 0, shift = 0, result = 0;
    do {
      byte = str.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);

    shift = 0; result = 0;
    do {
      byte = str.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);

    coordinates.push([lat / factor, lng / factor]); // [lat, lng]
  }
  return coordinates;
}

// ---------- 面板元素 ----------

// 交通工具取值与显示名称；服务端未构建的 profile 会在启动后从下拉框中移除
const VEHICLE_LABELS = {
  'driving-car': '汽车',
  'driving-hgv': '货车',
  'driving-military': '军车',
  'cycling-regular': '自行车',
  'cycling-mountain': '山地自行车',
  'cycling-road': '公路自行车',
  'cycling-electric': '电动自行车',
  'foot-walking': '步行',
  'foot-hiking': '徒步',
  'wheelchair': '轮椅',
  'public-transport': '公共交通'
};

function fillVehicleSelect(select, names) {
  const current = select.value;
  select.innerHTML = names
    .map(name => `<option value="${name}">${VEHICLE_LABELS[name] || name}</option>`)
    .join('');
  if (names.includes(current)) select.value = current;
}

// 请求路由中的 profile 必须与交通工具一致，但只有服务端已构建的 profile 才可用，
// 因此按 /v2/status 返回的 profiles 动态生成选项，避免选中未加载的交通工具触发
// "Parameter 'profile' has incorrect value of 'unknown'."
async function loadAvailableVehicles() {
  try {
    const resp = await fetch(`${API_BASE}/v2/status`);
    if (!resp.ok) return;
    const data = await resp.json();
    const names = Object.keys(data.profiles || {});
    if (!names.length) return;
    fillVehicleSelect(routeVehicleEl, names.filter(name => name !== 'driving-military'));
    fillVehicleSelect(isoVehicleEl, names);
    updateRouteOptionAvailability();
    updateIsoOptionAvailability();
  } catch (e) {
    // 状态接口不可用时保留页面内置的默认选项
  }
}
loadAvailableVehicles();

let activeTab = 'route';

function showError(msg) {
  errorEl.style.display = 'block';
  errorEl.textContent = msg;
}
function clearError() {
  errorEl.style.display = 'none';
  errorEl.textContent = '';
}

// 服务端返回 2003 表示该 profile 未在当前实例加载（例如后端还是旧版本或未构建该交通工具图），
// 此时按 /v2/status 刷新下拉框，并输出实际请求地址便于确认 profile 段
async function handleProfileUnavailable(url, data) {
  if (!data || !data.error || data.error.code !== 2003) return false;
  await loadAvailableVehicles();
  showError('当前服务实例未加载所选交通工具（profile）。已按服务端实际可用列表刷新，请重新选择。\n'
    + '请求地址：' + url + '\n' + JSON.stringify(data, null, 2));
  return true;
}

// 高德底图是 GCJ-02 坐标系，ORS 结果是 WGS84，两者之间需要纠偏
const useGcj = () => gcjToggle.checked && (basemapEl.value === 'amap' || basemapEl.value === 'amap-img');
const toMapCoord = (lat, lng) => useGcj() ? wgs84ToGcj02(lat, lng) : [lat, lng];
const toWgsCoord = (lat, lng) => useGcj() ? gcj02ToWgs84(lat, lng) : [lat, lng];

// ---------- Cesium 地球 ----------
let viewer;
try {
  viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayer: false,        // 不使用 Cesium Ion 默认影像，避免需要 token
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    animation: false,
    timeline: false,
    fullscreenButton: false,
    infoBox: false,
    selectionIndicator: false,
    terrainProvider: new Cesium.EllipsoidTerrainProvider() // 无 Ion token 时用椭球体（无地形起伏）
  });
} catch (e) {
  showError('Cesium 初始化失败：' + e.message + '\n（需要能访问 CDN；建议用 http 方式打开本页）');
}

if (viewer) {
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#e8eef6');
  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(121.5450, 25.0370, 12000),
    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-50), roll: 0 }
  });
}

// ---------- 三维地形（仅越野路径页使用） ----------
let ellipsoidTerrain = null;
let terrainProvider = null;
let terrainRequest = null;

// 懒加载 ArcGIS 公开高程服务（无需 Cesium Ion token），供越野路径页判读地形起伏
function ensureTerrain() {
  if (terrainProvider) return Promise.resolve(terrainProvider);
  if (!terrainRequest) {
    terrainRequest = Cesium.ArcGISTiledElevationTerrainProvider
      .fromUrl('https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer')
      .then(provider => { terrainProvider = provider; return provider; })
      .catch(e => { terrainRequest = null; throw e; });
  }
  return terrainRequest;
}

// 路线规划、等时线使用椭球体（无地形坡度），越野与混合页加载真实地形
function applyTerrainForTab(tab) {
  if (!viewer) return;
  if (tab !== 'offroad' && tab !== 'hybrid') {
    if (!ellipsoidTerrain) ellipsoidTerrain = new Cesium.EllipsoidTerrainProvider();
    viewer.terrainProvider = ellipsoidTerrain;
    return;
  }
  ensureTerrain()
    .then(provider => { if (viewer && (activeTab === 'offroad' || activeTab === 'hybrid')) viewer.terrainProvider = provider; })
    .catch(e => console.warn('地形服务加载失败，继续使用椭球体：', e));
}

// 地形垂直夸张：越野判读时把起伏放大，1x 为真实比例
function setVerticalExaggeration(value) {
  offroadExagValEl.textContent = value + 'x';
  if (!viewer) return;
  // Cesium 1.110+ 使用 scene.verticalExaggeration，旧版本挂在 globe 上
  if ('verticalExaggeration' in viewer.scene) viewer.scene.verticalExaggeration = value;
  else viewer.scene.globe.verticalExaggeration = value;
}
setVerticalExaggeration(Number(offroadExagEl.value));

// ---------- 底图 ----------
// OSM 瓦片走后端代理接口并落盘缓存（首次访问联网拉取，之后直接读本地文件）；
// 页面以 file:// 直接打开时无法访问后端，退回官方瓦片服务
const OSM_TILE_API = location.origin + location.pathname.replace(/[^/]*$/, '') + 'v2/tiles/osm';
function amapProvider() {
  return new Cesium.UrlTemplateImageryProvider({
    url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    subdomains: ['1', '2', '3', '4'],
    tilingScheme: new Cesium.WebMercatorTilingScheme(),
    maximumLevel: 18,
    credit: '© 高德地图'
  });
}
function amapImageProvider() {
  return new Cesium.UrlTemplateImageryProvider({
    url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
    subdomains: ['1', '2', '3', '4'],
    tilingScheme: new Cesium.WebMercatorTilingScheme(),
    maximumLevel: 18,
    credit: '© 高德地图'
  });
}
function osmProvider() {
  return new Cesium.UrlTemplateImageryProvider({
    url: location.protocol === 'file:'
      ? 'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
      : OSM_TILE_API + '/{z}/{x}/{y}.png',
    tilingScheme: new Cesium.WebMercatorTilingScheme(),
    maximumLevel: 19,
    credit: '© OpenStreetMap contributors'
  });
}

let baseImagery = null;
function setBaseLayer(kind) {
  if (!viewer) return;
  if (baseImagery) { viewer.imageryLayers.remove(baseImagery, true); baseImagery = null; }
  if (kind === 'amap') baseImagery = viewer.imageryLayers.addImageryProvider(amapProvider());
  else if (kind === 'amap-img') baseImagery = viewer.imageryLayers.addImageryProvider(amapImageProvider());
  else if (kind === 'osm') baseImagery = viewer.imageryLayers.addImageryProvider(osmProvider());
}

let isoCenter = null;   // WGS84 [lat, lng]
let offroadPoints = []; // WGS84 [lat, lng]
const routeEntities = [];
let routeLineEntity = null; // 当前路线折线，重新计算时先移除避免叠加

function removeEntities(arr) {
  arr.forEach(e => viewer && viewer.entities.remove(e));
  arr.length = 0;
}

function pointEntity(lat, lng, color, text) {
  const c = toMapCoord(lat, lng);
  return viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(c[1], c[0]),
    point: {
      pixelSize: 11, color: color, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    },
    label: {
      text: text, font: '13px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -22),
      showBackground: true, backgroundColor: Cesium.Color.WHITE.withAlpha(0.85), fillColor: Cesium.Color.BLACK,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
    }
  });
}

// ---------- 地名检索（起点 / 途经点 / 终点） ----------
// 检索服务地址可配置，默认为本机的 Nominatim 兼容服务
const DEFAULT_SEARCH_BASE = 'http://localhost:8088/';
const searchBaseEl = document.getElementById('search-base');
const searchRowsEl = document.getElementById('search-rows');
const addViaEl = document.getElementById('add-via');
// 槽位顺序即路线点顺序：起点 → 途经点… → 终点
let routeSlots = [
  { kind: 'start', point: null, text: '' },
  { kind: 'end', point: null, text: '' }
];
let searchSeq = 0;

// 把槽位中已选的点同步到 routePoints，保证与原有路线计算逻辑兼容
function refreshRoutePointsFromSlots() {
  routePoints = routeSlots.filter(s => s.point).map(s => s.point.slice());
}

// 仅对有坐标的槽位生成标记名称，保证空槽位不影响起点/终点标注
function slotLabelsWithPoints() {
  const labels = [];
  let viaIndex = 0;
  routeSlots.forEach(s => {
    if (!s.point) return;
    if (s.kind === 'start') labels.push('起点');
    else if (s.kind === 'end') labels.push('终点');
    else labels.push('途经' + (++viaIndex));
  });
  return labels;
}

function resetRouteSlots(startPoint, endPoint) {
  const toText = p => p ? `${p[0].toFixed(5)}, ${p[1].toFixed(5)}` : '';
  routeSlots = [
    { kind: 'start', point: startPoint ? startPoint.slice() : null, text: toText(startPoint) },
    { kind: 'end', point: endPoint ? endPoint.slice() : null, text: toText(endPoint) }
  ];
  refreshRoutePointsFromSlots();
  renderSearchRows();
}

// 组装 Nominatim 兼容检索地址，兼容带不带 /search 后缀的服务地址
function searchEndpoint() {
  let base = (searchBaseEl.value || '').trim() || DEFAULT_SEARCH_BASE;
  if (!/^https?:\/\//i.test(base)) base = 'http://' + base;
  base = base.replace(/\/+$/, '');
  return /\/search(\.php)?$/i.test(base) ? base : base + '/search';
}

function hideSuggest(el) {
  el.style.display = 'none';
  el.innerHTML = '';
}

function showSuggestMessage(el, text) {
  el.innerHTML = '';
  const msg = document.createElement('div');
  msg.className = 'msg';
  msg.textContent = text;
  el.append(msg);
  el.style.display = 'block';
}

async function searchPlaces(slot, input, suggest) {
  const q = input.value.trim();
  if (q.length < 2) { hideSuggest(suggest); return; }
  const seq = ++searchSeq;
  try {
    const url = `${searchEndpoint()}?format=jsonv2&limit=6&accept-language=zh-CN&q=${encodeURIComponent(q)}`;
    const resp = await fetch(url, { headers: { Accept: 'application/json' } });
    if (seq !== searchSeq) return;
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const items = await resp.json();
    if (seq !== searchSeq) return;
    if (!Array.isArray(items) || !items.length) { showSuggestMessage(suggest, '未找到匹配地点'); return; }
    renderSuggestions(slot, input, suggest, items);
  } catch (err) {
    if (seq !== searchSeq) return;
    showSuggestMessage(suggest, '检索失败：' + err.message + '（确认检索服务可访问且允许跨域）');
  }
}

function renderSuggestions(slot, input, suggest, items) {
  suggest.innerHTML = '';
  items.forEach(item => {
    const lat = parseFloat(item.lat);
    const lon = parseFloat(item.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    const name = item.name || (item.display_name || '').split(',')[0] || '未命名地点';
    const row = document.createElement('div');
    row.className = 'item';
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = name;
    const addrEl = document.createElement('div');
    addrEl.className = 'addr';
    addrEl.textContent = item.display_name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    row.append(nameEl, addrEl);
    // 用 mousedown 抢在输入框失焦前完成选择
    row.addEventListener('mousedown', e => {
      e.preventDefault();
      slot.point = [lat, lon];
      slot.text = item.display_name || name;
      input.value = slot.text;
      hideSuggest(suggest);
      refreshRoutePointsFromSlots();
      renderRouteMarkers();
      if (activeTab === 'route' && routePoints.length >= 2) computeRoute();
    });
    suggest.append(row);
  });
  suggest.style.display = suggest.childElementCount ? 'block' : 'none';
}

function renderSearchRows() {
  if (!searchRowsEl) return;
  searchRowsEl.innerHTML = '';
  let viaIndex = 0;
  routeSlots.forEach(slot => {
    const row = document.createElement('div');
    row.className = 'search-row';
    const label = document.createElement('label');
    label.className = 'lbl';
    if (slot.kind === 'via') label.textContent = '途经' + (++viaIndex);
    else label.textContent = slot.kind === 'start' ? '起点' : '终点';

    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.value = slot.text || '';
    input.placeholder = slot.kind === 'start' ? '输入起点后回车'
      : slot.kind === 'end' ? '输入终点后回车' : '输入途经点后回车';

    const suggest = document.createElement('div');
    suggest.className = 'suggest';

    row.append(label, input);
    if (slot.kind === 'via') {
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.title = '删除该途经点';
      rm.textContent = '×';
      rm.addEventListener('click', () => removeViaSlot(slot));
      row.append(rm);
    }
    row.append(suggest);
    searchRowsEl.append(row);

    let timer = null;
    input.addEventListener('input', () => {
      slot.text = input.value;
      if (slot.point) {
        slot.point = null;
        refreshRoutePointsFromSlots();
        renderRouteMarkers();
      }
      clearTimeout(timer);
      timer = setTimeout(() => searchPlaces(slot, input, suggest), 350);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); searchPlaces(slot, input, suggest); }
      else if (e.key === 'Escape') hideSuggest(suggest);
    });
    input.addEventListener('blur', () => setTimeout(() => hideSuggest(suggest), 150));
  });
}

function addViaSlot() {
  routeSlots.splice(routeSlots.length - 1, 0, { kind: 'via', point: null, text: '' });
  renderSearchRows();
}

function removeViaSlot(slot) {
  const index = routeSlots.indexOf(slot);
  if (index < 0) return;
  routeSlots.splice(index, 1);
  refreshRoutePointsFromSlots();
  renderSearchRows();
  renderRouteMarkers();
  if (routePoints.length >= 2) computeRoute();
  else routeResultEl.style.display = 'none';
}

addViaEl.addEventListener('click', addViaSlot);
renderSearchRows();

function renderRouteMarkers() {
  routeEntities.filter(e => e.__marker).forEach(e => { viewer.entities.remove(e); routeEntities.splice(routeEntities.indexOf(e), 1); });
  const labels = slotLabelsWithPoints();
  routePoints.forEach((p, i) => {
    const label = labels[i] || '点';
    const css = label === '起点' ? '#1e8e3e' : label === '终点' ? '#d93025' : '#f29900';
    const e = pointEntity(p[0], p[1], Cesium.Color.fromCssColorString(css), label);
    e.__marker = true;
    routeEntities.push(e);
  });
  ptsEl.textContent = routePoints.length
    ? routePoints.map((p, i) => `${labels[i] || '点'} WGS84: ${p[0].toFixed(5)}, ${p[1].toFixed(5)}`).join('\n')
    : '起点/终点：在地名检索框搜索，或在地球上点击选点';
}

function renderIsoCenter() {
  removeEntities(isoEntities);
  if (isoCenter) isoEntities.push(pointEntity(isoCenter[0], isoCenter[1], Cesium.Color.fromCssColorString('#f29900'), '中心点'));
  isoPtsEl.textContent = isoCenter
    ? `中心点 WGS84: ${isoCenter[0].toFixed(5)}, ${isoCenter[1].toFixed(5)}`
    : '中心点：在地球上点击选点';
}

function renderOffroadMarkers() {
  removeEntities(offroadEntities);
  offroadPoints.forEach((p, i) => {
    offroadEntities.push(pointEntity(p[0], p[1], i === 0 ? Cesium.Color.fromCssColorString('#1e8e3e') : Cesium.Color.fromCssColorString('#d93025'), i === 0 ? '起点' : '终点'));
  });
  offroadPtsEl.textContent = offroadPoints.length
    ? offroadPoints.map((p, i) => `${i === 0 ? '起点' : '终点'} WGS84: ${p[0].toFixed(5)}, ${p[1].toFixed(5)}`).join('\n')
    : '起点/终点：在地球上点击选点';
}

// ---------- 避让区域 / 业务围栏 ----------
let drawMode = null;        // 'avoid' | 'geofence'
let drawFirstCorner = null; // 首次点击的 WGS84 角点 [lat, lon]
let avoidZones = [];        // [{ label, bbox }]
let geofence = null;        // { bbox }
let avoidZoneEntities = [];
let geofenceEntity = null;

function bboxOf(a, b) {
  return {
    west: Math.min(a[1], b[1]),
    south: Math.min(a[0], b[0]),
    east: Math.max(a[1], b[1]),
    north: Math.max(a[0], b[0])
  };
}

function bboxRing(b) {
  return [
    [b.west, b.south], [b.east, b.south],
    [b.east, b.north], [b.west, b.north],
    [b.west, b.south]
  ];
}

function rectEntity(bbox, color, fillAlpha, label) {
  const flat = [];
  bboxRing(bbox).forEach(p => { const m = toMapCoord(p[1], p[0]); flat.push(m[1], m[0]); });
  return viewer.entities.add({
    polygon: {
      hierarchy: Cesium.Cartesian3.fromDegreesArray(flat),
      material: color.withAlpha(fillAlpha),
      outline: true,
      outlineColor: color
    },
    description: label
  });
}

function renderAvoidZonesAndFence() {
  avoidZoneEntities.forEach(e => viewer.entities.remove(e));
  avoidZoneEntities = avoidZones.map(z =>
    rectEntity(z.bbox, Cesium.Color.fromCssColorString('#d93025'), 0.18, z.label));
  if (geofenceEntity) { viewer.entities.remove(geofenceEntity); geofenceEntity = null; }
  if (geofence) geofenceEntity = rectEntity(geofence.bbox, Cesium.Color.fromCssColorString('#1e8e3e'), 0.06, '业务围栏');
}

function startDraw(mode) {
  drawMode = mode;
  drawFirstCorner = null;
  drawHintEl.style.display = 'block';
  drawHintEl.textContent = (mode === 'avoid' ? '避让区域：' : '业务围栏：') + '点击两个对角点完成框选';
}

function cancelDraw() {
  drawMode = null;
  drawFirstCorner = null;
  drawHintEl.style.display = 'none';
}

function finishDraw(wgs) {
  if (!drawFirstCorner) {
    drawFirstCorner = wgs.slice();
    drawHintEl.textContent = '再点击一次确定矩形对角点';
    return;
  }
  const bbox = bboxOf(drawFirstCorner, wgs);
  if (bbox.east - bbox.west < 1e-6 || bbox.north - bbox.south < 1e-6) {
    showError('框选区域过小，请重新选择对角点');
    return;
  }
  if (drawMode === 'avoid') {
    avoidZones.push({ label: avoidZoneTypeEl.options[avoidZoneTypeEl.selectedIndex].text, bbox });
  } else {
    geofence = { bbox };
  }
  cancelDraw();
  renderAvoidZonesAndFence();
  clearError();
  if (routePoints.length >= 2) computeRoute();
}

function clearAvoidZones() {
  avoidZoneEntities.forEach(e => viewer.entities.remove(e));
  avoidZoneEntities = [];
  avoidZones = [];
}

function clearGeofence() {
  if (geofenceEntity) { viewer.entities.remove(geofenceEntity); geofenceEntity = null; }
  geofence = null;
}

function clearOverlays() {
  removeEntities(routeEntities);
  if (routeLineEntity) { viewer.entities.remove(routeLineEntity); routeLineEntity = null; }
  removeEntities(isoEntities);
  removeEntities(offroadEntities);
  removeEntities(offroadShapes);
  removeEntities(offroadBarriers);
  removeEntities(hybridEntities);
  removeEntities(hybridShapes);
  removeOffroadHoverMarker();
  clearAvoidZones();
  clearGeofence();
  cancelDraw();
  routePoints = [];
  resetRouteSlots(null, null);
  isoCenter = null;
  offroadPoints = [];
  offroadData = null;
  offroadProfile = null;
  hybridPoints = [];
  hybridData = null;
  // 中止仍在进行的越野/混合路径计算
  if (offroadAbort) { offroadAbort.abort(); offroadAbort = null; }
  if (hybridAbort) { hybridAbort.abort(); hybridAbort = null; }
  loadingEl.textContent = '计算中…';
  loadingEl.style.display = 'none';
  routeResultEl.style.display = 'none';
  isoResultEl.style.display = 'none';
  offroadResultEl.style.display = 'none';
  offroadActionsEl.style.display = 'none';
  offroadCancelEl.style.display = 'none';
  hybridResultEl.style.display = 'none';
  hybridActionsEl.style.display = 'none';
  hybridCancelEl.style.display = 'none';
  clearError();
  renderRouteMarkers();
  renderIsoCenter();
  renderOffroadMarkers();
  renderHybridMarkers();
}

function zoomToRect(west, south, east, north) {
  const padLat = Math.max((north - south) * 0.35, 0.0025);
  const padLng = Math.max((east - west) * 0.35, 0.0025);
  viewer.camera.flyTo({
    destination: Cesium.Rectangle.fromDegrees(west - padLng, south - padLat, east + padLng, north + padLat),
    duration: 0.9
  });
}

function pickGlobe(screenPos) {
  const scene = viewer.scene;
  const ray = viewer.camera.getPickRay(screenPos);
  if (ray) {
    const picked = scene.globe.pick(ray, scene);
    if (picked) return picked;
  }
  return viewer.camera.pickEllipsoid(screenPos, scene.globe.ellipsoid);
}

// ---------- 路线规划 ----------
function routeRecompute() {
  if (activeTab === 'route' && routePoints.length >= 2) computeRoute();
}

// 不同交通工具支持的选项不同：避让要素仅驾车类有效，车辆限制仅货车有效
function updateRouteOptionAvailability() {
  const profile = routeVehicleEl.value;
  const isDriving = profile.startsWith('driving-');
  const isHgv = profile === 'driving-hgv';
  [avoidHighwaysEl, avoidTollwaysEl, avoidFerriesEl].forEach(el => { el.disabled = !isDriving; });
  vehicleTypeEl.disabled = !isHgv;
  [restrictHeightEl, restrictWidthEl, restrictWeightEl, restrictAxleloadEl, restrictHazmatEl]
    .forEach(el => { el.disabled = !isHgv; });
}

async function computeRoute() {
  const body = {
    coordinates: routePoints.map(p => [p[1], p[0]]), // ORS 需要 [lon, lat]
    preference: prefEl.value,
    instructions: true,
    language: 'zh-cn' // 导航指令使用中文（左转/右转/直行 + 道路名）
  };
  const options = buildRouteOptions();
  if (Object.keys(options).length) body.options = options;

  loadingEl.style.display = 'inline';
  routeResultEl.style.display = 'none';
  clearError();
  const url = `${API_BASE}/v2/directions/${encodeURIComponent(routeVehicleEl.value)}`;
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (await handleProfileUnavailable(url, data)) return;
      showError('HTTP ' + resp.status + '\n' + JSON.stringify(data, null, 2));
      return;
    }
    drawRoute(data);
  } catch (err) {
    showError('请求失败：' + err.message + '\n（确认服务已启动、地址正确，且允许跨域）');
  } finally {
    loadingEl.style.display = 'none';
  }
}

// 组装 ORS directions 的 options：车辆限制、避让要素、避让区域
function buildRouteOptions() {
  const options = {};

  const avoidFeatures = [];
  if (routeVehicleEl.value.startsWith('driving-')) {
    if (avoidHighwaysEl.checked) avoidFeatures.push('highways');
    if (avoidTollwaysEl.checked) avoidFeatures.push('tollways');
    if (avoidFerriesEl.checked) avoidFeatures.push('ferries');
  }
  if (avoidFeatures.length) options.avoid_features = avoidFeatures;

  if (avoidZones.length) {
    options.avoid_polygons = {
      type: 'MultiPolygon',
      coordinates: avoidZones.map(z => [bboxRing(z.bbox)])
    };
  }

  // 重型车辆限制只对民用货车 driving-hgv 生效
  if (routeVehicleEl.value === 'driving-hgv') {
    options.vehicle_type = vehicleTypeEl.value;
    const restrictions = {};
    const height = Number(restrictHeightEl.value);
    const width = Number(restrictWidthEl.value);
    const weight = Number(restrictWeightEl.value);
    const axleload = Number(restrictAxleloadEl.value);
    if (height > 0) restrictions.height = height;
    if (width > 0) restrictions.width = width;
    if (weight > 0) restrictions.weight = weight;
    if (axleload > 0) restrictions.axleload = axleload;
    if (restrictHazmatEl.checked) restrictions.hazmat = true;
    if (Object.keys(restrictions).length) options.profile_params = { restrictions };
  }

  return options;
}

// ORS instruction type -> 中文动作文字与箭头图标（与后端 InstructionType 枚举一致）
const ROUTE_STEP_ACTIONS = {
  0: { icon: '←', label: '左转' },
  1: { icon: '→', label: '右转' },
  2: { icon: '↖', label: '向左急转' },
  3: { icon: '↗', label: '向右急转' },
  4: { icon: '↖', label: '稍向左转' },
  5: { icon: '↗', label: '稍向右转' },
  6: { icon: '↑', label: '直行' },
  7: { icon: '↻', label: '进入环岛' },
  8: { icon: '↺', label: '驶出环岛' },
  9: { icon: '⤿', label: '掉头' },
  10: { icon: '⚑', label: '到达目的地' },
  11: { icon: '▶', label: '出发' },
  12: { icon: '↖', label: '靠左行驶' },
  13: { icon: '↗', label: '靠右行驶' }
};

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g,
    ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function formatStepDistance(meters) {
  if (!(meters >= 0)) return '';
  return meters >= 1000 ? (meters / 1000).toFixed(1) + ' km' : Math.round(meters) + ' m';
}

function formatStepDuration(seconds) {
  if (!(seconds >= 0)) return '';
  return seconds < 60 ? '不到 1 分' : formatDuration(seconds);
}

// 把 segments[].steps[] 渲染成逐条导航指引：动作 + 道路名 + 该段距离/耗时
function renderRouteSteps(segments) {
  const rows = [];
  (segments || []).forEach(segment => {
    (segment.steps || []).forEach(step => {
      const action = ROUTE_STEP_ACTIONS[step.type];
      const name = step.name && step.name !== '-' ? escapeHtml(step.name) : '';
      let text;
      if (action) {
        text = `<span class="act">${action.label}</span>`;
        if (step.type === 8 && step.exit_number) {
          text = `<span class="act">从第 ${step.exit_number} 个出口驶出环岛</span>`;
        }
        if (name) {
          if (step.type === 10) text += `（${name}）`;
          else if (step.type === 11) text += ` 沿 <span class="road">${name}</span>`;
          else if (step.type !== 7) text += ` 进入 <span class="road">${name}</span>`;
        }
      } else {
        text = `<span class="act">${escapeHtml(step.instruction || '继续前行')}</span>`;
      }
      const dist = formatStepDistance(step.distance);
      const dur = formatStepDuration(step.duration);
      const meta = [dist, dur].filter(Boolean).join('<br>');
      rows.push(
        `<div class="route-step">` +
        `<span class="ic">${action ? action.icon : '•'}</span>` +
        `<span class="tx">${text}</span>` +
        (meta ? `<span class="mt">${meta}</span>` : '') +
        `</div>`
      );
    });
  });
  return rows.join('');
}

function drawRoute(data) {
  // ORS v2 返回 {metadata, routes, bbox}，routes[0].geometry 是 encoded polyline；
  // 同时兼容 GeoJSON FeatureCollection 形状。
  let coords = [];
  let summary = {};
  let segments = [];
  if (Array.isArray(data.routes) && data.routes.length) {
    const route = data.routes[0];
    summary = route.summary || {};
    segments = route.segments || [];
    const geom = route.geometry;
    coords = typeof geom === 'string'
      ? decodePolyline(geom, 5)
      : ((geom && geom.coordinates) || []).map(c => [c[1], c[0]]);
  } else if (data.features && data.features[0]) {
    const feature = data.features[0];
    const props = feature.properties || {};
    summary = props.summary || props; // GeoJSON 响应的 distance/duration 直接挂在 properties 上
    segments = props.segments || [];
    const geom = feature.geometry;
    coords = typeof geom === 'string'
      ? decodePolyline(geom, 5)
      : ((geom && geom.coordinates) || []).map(c => [c[1], c[0]]);
  }

  if (!coords.length) { showError('未解析到路线几何数据：\n' + JSON.stringify(data).slice(0, 800)); return; }

  if (routeLineEntity) { viewer.entities.remove(routeLineEntity); routeLineEntity = null; }

  const flat = [];
  let west = 180, south = 90, east = -180, north = -90;
  coords.forEach(c => {
    const m = toMapCoord(c[0], c[1]);
    flat.push(m[1], m[0]);
    west = Math.min(west, m[1]); east = Math.max(east, m[1]);
    south = Math.min(south, m[0]); north = Math.max(north, m[0]);
  });

  routeLineEntity = viewer.entities.add({
    polyline: {
      positions: Cesium.Cartesian3.fromDegreesArray(flat),
      width: 6,
      clampToGround: true,
      material: new Cesium.PolylineOutlineMaterialProperty({
        color: Cesium.Color.fromCssColorString('#1a73e8'),
        outlineWidth: 2,
        outlineColor: Cesium.Color.WHITE
      })
    }
  });

  zoomToRect(west, south, east, north);

  const dist = summary.distance != null ? (summary.distance / 1000).toFixed(2) + ' km' : '-';
  const dur = summary.duration != null ? formatDuration(summary.duration) : '-';
  const vehicleText = routeVehicleEl.options[routeVehicleEl.selectedIndex].text;
  const outsideFence = geofence && coords.some(c => {
    const lat = c[0], lon = c[1];
    return lon < geofence.bbox.west || lon > geofence.bbox.east || lat < geofence.bbox.south || lat > geofence.bbox.north;
  });
  const stepsHtml = renderRouteSteps(segments);
  routeResultEl.style.display = 'block';
  routeResultEl.innerHTML =
    `<div class="big">${dist} · ${dur}</div>` +
    `<div style="color:#555;margin-top:4px">${vehicleText}（${routeVehicleEl.value}）· 偏好 ${prefEl.options[prefEl.selectedIndex].text}，点 ${coords.length} 个</div>` +
    (outsideFence ? '<div style="color:#d93025;margin-top:4px">路线超出业务围栏范围，请调整起终点或围栏</div>' : '') +
    (stepsHtml
      ? `<div class="route-steps">${stepsHtml}</div>`
      : '<div style="color:#777;margin-top:6px">未返回导航指令（请确认服务端已开启 instructions）</div>');
}

// ---------- 越野路径 ----------
let offroadAbort = null;        // 当前请求的取消控制器
let offroadData = null;         // 最近一次返回结果，供导出使用
let offroadProfile = null;      // 高程剖面，供 hover 联动使用
let offroadHoverEntity = null;  // 剖面 hover 时在地图上显示的高程点

async function computeOffroad() {
  const gridInterval = Number(offroadGridEl.value);
  const maxSlope = Number(offroadMaxSlopeEl.value);
  if (!(gridInterval >= 10 && gridInterval <= 1000)) { showError('网格间距需在 10~1000 米之间'); return; }
  if (!(maxSlope >= 1 && maxSlope <= 60)) { showError('最大坡度需在 1~60 度之间'); return; }

  // 越野路径固定使用影像底图，便于判读地形
  if (basemapEl.value !== 'amap-img') {
    basemapEl.value = 'amap-img';
    setBaseLayer('amap-img');
    renderOffroadMarkers();
  }

  const body = {
    coordinates: offroadPoints.map(p => [p[1], p[0]]), // 接口需要 [lon, lat]
    grid_interval: gridInterval,
    max_slope: maxSlope,
    vehicle: offroadVehicleEl.value
  };

  // 同一时刻只保留一个计算请求，新请求会取消上一次未完成的请求
  if (offroadAbort) offroadAbort.abort();
  const controller = new AbortController();
  offroadAbort = controller;

  loadingEl.textContent = `越野路径计算中（网格 ${gridInterval} m）…`;
  loadingEl.style.display = 'inline';
  offroadCancelEl.style.display = 'inline-block';
  offroadActionsEl.style.display = 'flex';
  offroadResultEl.style.display = 'none';
  clearError();
  // 后端不返回进度，这里用计时器提示已等待时长
  let elapsed = 0;
  const timer = setInterval(() => {
    elapsed += 1;
    if (offroadAbort === controller) {
      loadingEl.textContent = `越野路径计算中 ${elapsed}s（网格 ${gridInterval} m）…`;
    }
  }, 1000);
  try {
    const resp = await fetch(`${API_BASE}/v2/offroad`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal
    });
    const data = await resp.json();
    if (!resp.ok) {
      offroadActionsEl.style.display = 'none';
      offroadResultEl.style.display = 'none';
      showError('HTTP ' + resp.status + '\n' + JSON.stringify(data, null, 2));
      return;
    }
    drawOffroad(data);
  } catch (err) {
    // 主动取消不视为错误
    if (err.name !== 'AbortError') {
      showError('请求失败：' + err.message + '\n（确认服务已启动、地址正确，且允许跨域）');
    }
  } finally {
    clearInterval(timer);
    if (offroadAbort === controller) {
      offroadAbort = null;
      loadingEl.textContent = '计算中…';
      loadingEl.style.display = 'none';
      offroadCancelEl.style.display = 'none';
    }
  }
}

function drawOffroad(data) {
  removeEntities(offroadShapes);
  removeEntities(offroadBarriers);
  removeOffroadHoverMarker();
  offroadData = data;

  const geom = data.geometry || {};
  const coords = geom.coordinates || [];
  if (!coords.length) {
    clearError();
    removeEntities(offroadBarriers);
    // 后端会返回 message 说明无路径的原因
    offroadResultEl.style.display = 'block';
    offroadResultEl.innerHTML =
      `<div class="big">未找到可行路径</div>` +
      `<div style="color:#555;margin-top:4px">${data.message || '请调整坡度阈值或网格间距后重试'}</div>`;
    offroadActionsEl.style.display = 'none';
    return;
  }

  const flat = [];
  let west = 180, south = 90, east = -180, north = -90;
  coords.forEach(c => {
    const m = toMapCoord(c[1], c[0]);
    flat.push(m[1], m[0]);
    west = Math.min(west, m[1]); east = Math.max(east, m[1]);
    south = Math.min(south, m[0]); north = Math.max(north, m[0]);
  });

  offroadShapes.push(viewer.entities.add({
    polyline: {
      positions: Cesium.Cartesian3.fromDegreesArray(flat),
      width: 6,
      clampToGround: true,
      material: new Cesium.PolylineDashMaterialProperty({
        color: Cesium.Color.fromCssColorString('#e8710a'),
        dashLength: 16
      })
    }
  }));

  // 坡度超限的障碍区域（后端已把相邻网格合并为面）
  const barriers = data.barriers;
  const barrierPolygons = barriers
    ? (barriers.type === 'MultiPolygon' ? barriers.coordinates : (barriers.type === 'Polygon' ? [barriers.coordinates] : []))
    : [];
  const showBarrier = offroadShowBarrierEl.checked;
  barrierPolygons.forEach(poly => {
    const entity = viewer.entities.add({
      polygon: {
        hierarchy: polygonHierarchy(poly),
        material: Cesium.Color.fromCssColorString('#d93025').withAlpha(0.35),
        classificationType: Cesium.ClassificationType.TERRAIN
      }
    });
    entity.show = showBarrier;
    offroadBarriers.push(entity);
  });

  if (west < east && south < north) zoomToRect(west, south, east, north);

  const summary = data.summary || {};
  const num = (v, unit) => (v == null ? '—' : `${v}${unit}`);
  const distanceText = summary.distance != null ? (summary.distance / 1000).toFixed(2) + ' km' : '—';
  const durationText = summary.duration != null ? formatDuration(summary.duration) : '—';
  offroadProfile = data.elevation || null;
  const vehicleOption = Array.from(offroadVehicleEl.options).find(o => o.value === data.vehicle);
  const vehicleText = vehicleOption ? vehicleOption.text : (data.vehicle || '-');

  offroadResultEl.style.display = 'block';
  offroadResultEl.innerHTML =
    `<div class="big">${distanceText} · 约 ${durationText}</div>` +
    `<div style="color:#555;margin-top:4px">交通工具 ${vehicleText} · 点 ${coords.length} 个 · 网格 ${data.grid_interval} m · 坡度阈值 ${data.max_slope}°</div>` +
    `<div style="color:#555;margin-top:2px">剖面最大坡度 ${num(summary.max_slope, '°')} · 平均 ${num(summary.avg_slope, '°')} · 爬升 ${num(summary.ascend, ' m')} · 下降 ${num(summary.descend, ' m')}</div>` +
    `<div style="color:#555;margin-top:2px">障碍网格 ${summary.barrier_count != null ? summary.barrier_count : barrierPolygons.length} 个</div>` +
    elevationProfileHtml(data.elevation);
  offroadActionsEl.style.display = 'flex';
  offroadCancelEl.style.display = 'none';
  bindOffroadProfileHover();
}

// ---------- 公路+越野混合（独立标签页，状态与纯越野互不影响） ----------
function renderHybridMarkers() {

async function computeHybrid() {

function drawHybrid(data) {
  removeEntities(hybridShapes);
  hybridData = data;

  const coords = (data.geometry && data.geometry.coordinates) || [];
  if (!coords.length) {
    clearError();
    hybridResultEl.style.display = 'block';
    hybridResultEl.innerHTML =
      `<div class="big">未找到可行路径</div>` +
      `<div style="color:#555;margin-top:4px">${data.message || '请调整坡度阈值或网格间距后重试'}</div>`;
    hybridActionsEl.style.display = 'none';
    return;
  }

  // 按分段着色：公路蓝、越野橙；后端未返回分段时回退为整条单色
  const flat = [];
  let west = 180, south = 90, east = -180, north = -90;
  const extendBounds = (m) => {
    west = Math.min(west, m[1]); east = Math.max(east, m[1]);
    south = Math.min(south, m[0]); north = Math.max(north, m[0]);
  };
  coords.forEach(c => {
    const m = toMapCoord(c[1], c[0]);
    flat.push(m[1], m[0]);
    extendBounds(m);
  });
  const drawSegmentLine = (points, color) => {
    const flatSegment = [];
    points.forEach(c => {
      const m = toMapCoord(c[1], c[0]);
      flatSegment.push(m[1], m[0]);
      extendBounds(m);
    });
    if (flatSegment.length < 4) return;
    hybridShapes.push(viewer.entities.add({
      polyline: {
        positions: Cesium.Cartesian3.fromDegreesArray(flatSegment),
        width: 7,
        clampToGround: true,
        material: Cesium.Color.fromCssColorString(color)
      }
    }));
  };
  const coloredSegments = (data.segments || []).filter(s => Array.isArray(s.coordinates) && s.coordinates.length >= 2);
  if (coloredSegments.length) {
    // 分段坐标与路径几何来自同一组网格中心点，颜色交界处能够衔接
    coloredSegments.forEach(s => drawSegmentLine(s.coordinates, s.type === 'road' ? '#1a73e8' : '#e8710a'));
  } else {
    hybridShapes.push(viewer.entities.add({
      polyline: {
        positions: Cesium.Cartesian3.fromDegreesArray(flat),
        width: 6,
        clampToGround: true,
        material: Cesium.Color.fromCssColorString('#1a73e8')
      }
    }));
  }
  if (west < east && south < north) zoomToRect(west, south, east, north);

  const summary = data.summary || {};
  const num = (v, unit) => (v == null ? '—' : `${v}${unit}`);
  const distanceText = summary.distance != null ? (summary.distance / 1000).toFixed(2) + ' km' : '—';
  const durationText = summary.duration != null ? formatDuration(summary.duration) : '—';
  // 分段明细：说明每一段何时走公路、何时越野，以及对应里程、耗时和速度
  const segs = data.segments || [];
  const segHtml = segs.length
    ? `<div style="margin-top:8px;border-top:1px solid #e3e6ec;padding-top:6px;max-height:170px;overflow:auto">` +
      segs.map(s => {
        const isRoad = s.type === 'road';
        const tag = isRoad
          ? '<span style="color:#1a73e8;font-weight:600">公路</span>'
          : '<span style="color:#b3261e;font-weight:600">越野</span>';
        const segKm = (s.distance / 1000).toFixed(2);
        const segDur = formatDuration(s.duration);
        const speed = s.duration > 0 ? (s.distance / s.duration * 3.6).toFixed(1) + ' km/h' : '—';
        const from = `${s.start[1].toFixed(5)}, ${s.start[0].toFixed(5)}`;
        const to = `${s.end[1].toFixed(5)}, ${s.end[0].toFixed(5)}`;
        return `<div style="font-size:12px;color:#333;padding:4px 0;border-bottom:1px dashed #eef0f4">` +
          `<div>${s.index}. ${tag} · ${segKm} km · ${segDur} · 均速 ${speed}</div>` +
          `<div style="color:#888">${from} → ${to}</div></div>`;
      }).join('') +
      `<div style="font-size:12px;color:#777;margin-top:4px">公路段按路网速度计算；无路可走、接驳起终点或绕开超坡区域时转入越野段（上坡衰减快、下坡仅安全减速，并计入公路优先惩罚）。</div>` +
      `</div>`
    : '';
  hybridResultEl.style.display = 'block';
  hybridResultEl.innerHTML =
    `<div class="big">${distanceText} · 约 ${durationText}</div>` +
    `<div style="color:#555;margin-top:4px">${data.profile || hybridProfileEl.value} · 越野 ${data.offroad_speed_kmh ?? '—'} km/h · 公路优先 ${data.offroad_penalty ?? '—'} 倍 · 网格 ${data.grid_interval} m</div>` +
    `<div style="margin-top:4px;font-size:12px"><span style="color:#1a73e8">━ 公路段</span>　<span style="color:#e8710a">━ 越野段</span></div>` +
    `<div style="color:#555;margin-top:2px">剖面最大坡度 ${num(summary.max_slope, '°')} · 平均 ${num(summary.avg_slope, '°')} · 爬升 ${num(summary.ascend, ' m')} · 下降 ${num(summary.descend, ' m')}</div>` +
    segHtml +
    elevationProfileHtml(data.elevation);
  hybridActionsEl.style.display = 'flex';
  hybridCancelEl.style.display = 'none';
}

function elevationProfileHtml(profile) {
  if (!profile || !Array.isArray(profile.samples) || profile.samples.length < 2) return '';
  const w = 300, h = 88, padX = 4, padY = 12;
  const dist = profile.distance || profile.samples[profile.samples.length - 1].distance || 1;
  const min = profile.min;
  const max = profile.max;
  const span = Math.max(1, max - min);
  const points = profile.samples.map(s => {
    const x = padX + (s.distance / dist) * (w - 2 * padX);
    const y = h - padY - ((s.ele - min) / span) * (h - 2 * padY);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const area = `${padX},${h - padY} ${points} ${w - padX},${h - padY}`;
  return `
    <div id="offroad-profile-tip" style="margin-top:6px;color:#555;min-height:18px">距离 ${(dist / 1000).toFixed(2)} km · 最高 ${max} m · 最低 ${min} m · 累计爬升 ${profile.ascend} m</div>
    <svg id="offroad-profile" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin-top:2px;background:#fff;border-radius:4px;max-width:100%;cursor:crosshair">
      <polygon points="${area}" fill="#e8710a" fill-opacity="0.18"></polygon>
      <polyline points="${points}" fill="none" stroke="#e8710a" stroke-width="2"></polyline>
      <g id="offroad-profile-hover" style="display:none">
        <line x1="0" y1="${padY}" x2="0" y2="${h - padY}" stroke="#555" stroke-width="1" stroke-dasharray="3,3"></line>
        <circle r="3.5" fill="#e8710a" stroke="#fff" stroke-width="1"></circle>
      </g>
      <text x="${padX}" y="${padY - 2}" font-size="10" fill="#666">${max} m</text>
      <text x="${padX}" y="${h - 2}" font-size="10" fill="#666">${min} m</text>
    </svg>`;
}

/**
 * 剖面图 hover 联动：鼠标在剖面图移动时，高亮对应采样点并在地图上显示该点高程。
 */
function bindOffroadProfileHover() {
  const svg = document.getElementById('offroad-profile');
  const tip = document.getElementById('offroad-profile-tip');
  if (!svg || !tip || !offroadProfile || !Array.isArray(offroadProfile.samples)) return;
  const samples = offroadProfile.samples;
  if (samples.length < 2) return;
  const hover = svg.querySelector('#offroad-profile-hover');
  const line = hover.querySelector('line');
  const circle = hover.querySelector('circle');
  const w = 300, h = 88, padX = 4, padY = 12;
  const dist = offroadProfile.distance || samples[samples.length - 1].distance || 1;
  const min = offroadProfile.min;
  const span = Math.max(1, offroadProfile.max - min);
  const baseTip = tip.textContent;
  const pointOf = (s) => [
    padX + (s.distance / dist) * (w - 2 * padX),
    h - padY - ((s.ele - min) / span) * (h - 2 * padY)
  ];

  svg.addEventListener('mousemove', (ev) => {
    const rect = svg.getBoundingClientRect();
    const x = ((ev.clientX - rect.left) / rect.width) * w;
    // 找到横向距离最近的采样点
    let best = samples[0];
    let bestDx = Infinity;
    samples.forEach(s => {
      const dx = Math.abs(pointOf(s)[0] - x);
      if (dx < bestDx) { bestDx = dx; best = s; }
    });
    const [bx, by] = pointOf(best);
    hover.style.display = '';
    line.setAttribute('x1', bx);
    line.setAttribute('x2', bx);
    circle.setAttribute('cx', bx);
    circle.setAttribute('cy', by);
    tip.textContent = `${(best.distance / 1000).toFixed(2)} km · 海拔 ${best.ele} m`;
    showOffroadHoverMarker(best);
  });
  svg.addEventListener('mouseleave', () => {
    hover.style.display = 'none';
    tip.textContent = baseTip;
    removeOffroadHoverMarker();
  });
}

function showOffroadHoverMarker(sample) {
  if (!viewer || sample == null || sample.lat == null || sample.lon == null) return;
  const c = toMapCoord(sample.lat, sample.lon);
  const position = Cesium.Cartesian3.fromDegrees(c[1], c[0]);
  if (!offroadHoverEntity) {
    offroadHoverEntity = viewer.entities.add({
      position: position,
      point: {
        pixelSize: 9, color: Cesium.Color.fromCssColorString('#e8710a'),
        outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
      },
      label: {
        text: '', font: '12px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -16),
        showBackground: true, backgroundColor: Cesium.Color.WHITE.withAlpha(0.9), fillColor: Cesium.Color.BLACK,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
      }
    });
  }
  offroadHoverEntity.position = position;
  offroadHoverEntity.label.text = `${sample.ele} m`;
}

function removeOffroadHoverMarker() {
  if (offroadHoverEntity && viewer) viewer.entities.remove(offroadHoverEntity);
  offroadHoverEntity = null;
}

// ---------- 结果导出 ----------
function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function offroadFileName(ext) {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  return `offroad_${stamp}.${ext}`;
}

// GPX 使用接口返回的 WGS84 原始坐标（不是纠偏后的高德坐标）
function buildGpx(data) {
  const samples = data.elevation && Array.isArray(data.elevation.samples) ? data.elevation.samples : [];
  let trkpts;
  if (samples.length) {
    trkpts = samples.map(s => `      <trkpt lat="${s.lat}" lon="${s.lon}"><ele>${s.ele}</ele></trkpt>`).join('\n');
  } else {
    trkpts = (data.geometry.coordinates || []).map(c => `      <trkpt lat="${c[1]}" lon="${c[0]}"></trkpt>`).join('\n');
  }
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Geovis Route Offroad" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>越野路径</name>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>`;
}

function buildGeoJson(data) {
  const elevation = data.elevation;
  const feature = {
    type: 'Feature',
    geometry: data.geometry,
    properties: {
      grid_interval: data.grid_interval,
      max_slope: data.max_slope,
      vehicle: data.vehicle,
      speed_kmh: data.speed_kmh,
      summary: data.summary || {},
      elevation: elevation
        ? { min: elevation.min, max: elevation.max, ascend: elevation.ascend, descend: elevation.descend }
        : null
    }
  };
  return JSON.stringify({ type: 'FeatureCollection', features: [feature] }, null, 2);
}

// ---------- 等时线 ----------
function updateIsoOptionAvailability() {
  const isDriving = isoVehicleEl.value.startsWith('driving-');
  [isoAvoidHighwaysEl, isoAvoidTollwaysEl, isoAvoidFerriesEl].forEach(el => { el.disabled = !isDriving; });
}

async function computeIsochrone() {
  if (!isoCenter) return;
  const rangeType = rangeTypeEl.value;
  // 支持多级范围：逗号/空格分隔，例如 300,600,900
  const ranges = rangeValueEl.value.split(/[,，\s]+/)
    .map(v => Math.round(Number(v)))
    .filter(v => v > 0);
  if (!ranges.length) { showError('范围值需为正数，多级用逗号分隔，如 300,600,900'); return; }
  if (ranges.length > 5) { showError('最多支持 5 级范围（maximum_intervals=5）'); return; }
  ranges.sort((a, b) => a - b);

  const body = {
    locations: [[isoCenter[1], isoCenter[0]]], // ORS 需要 [lon, lat]
    range: ranges,
    range_type: rangeType,
    location_type: isoLocationTypeEl.value
  };

  // 避让要素仅驾车类 profile 支持
  if (isoVehicleEl.value.startsWith('driving-')) {
    const avoidFeatures = [];
    if (isoAvoidHighwaysEl.checked) avoidFeatures.push('highways');
    if (isoAvoidTollwaysEl.checked) avoidFeatures.push('tollways');
    if (isoAvoidFerriesEl.checked) avoidFeatures.push('ferries');
    if (avoidFeatures.length) body.options = { avoid_features: avoidFeatures };
  }

  if (isoAttrAreaEl.checked) body.attributes = ['area'];

  loadingEl.style.display = 'inline';
  isoResultEl.style.display = 'none';
  clearError();
  const url = `${API_BASE}/v2/isochrones/${encodeURIComponent(isoVehicleEl.value)}`;
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (await handleProfileUnavailable(url, data)) return;
      showError('HTTP ' + resp.status + '\n' + JSON.stringify(data, null, 2));
      return;
    }
    drawIsochrones(data, rangeType, ranges);
  } catch (err) {
    showError('请求失败：' + err.message + '\n（确认服务已启动、地址正确，且允许跨域）');
  } finally {
    loadingEl.style.display = 'none';
  }
}

function ringPositions(ring) {
  const flat = [];
  ring.forEach(p => { const m = toMapCoord(p[1], p[0]); flat.push(m[1], m[0]); });
  return Cesium.Cartesian3.fromDegreesArray(flat);
}

function polygonHierarchy(rings) {
  const holes = rings.slice(1).map(r => new Cesium.PolygonHierarchy(ringPositions(r)));
  return new Cesium.PolygonHierarchy(ringPositions(rings[0]), holes);
}

function drawIsochrones(data, rangeType, ranges) {
  const features = data.features || [];
  if (!features.length) { showError('响应里没有 features：\n' + JSON.stringify(data).slice(0, 800)); return; }

  const palette = ['#1a73e8', '#1e8e3e', '#f29900', '#d93025', '#9334e6'];
  let west = 180, south = 90, east = -180, north = -90;
  // 多级范围时只在最大一圈的中心画一个标记，避免标签重叠
  const maxIdx = features.reduce((best, f, idx) => {
    const v = Number(f.properties && f.properties.value) || 0;
    const bv = Number(features[best].properties && features[best].properties.value) || 0;
    return v > bv ? idx : best;
  }, 0);

  features.forEach((f, i) => {
    const geom = f.geometry || {};
    const color = Cesium.Color.fromCssColorString(palette[i % palette.length]);
    const polygons = geom.type === 'MultiPolygon' ? geom.coordinates : (geom.type === 'Polygon' ? [geom.coordinates] : []);

    polygons.forEach(poly => {
      isoEntities.push(viewer.entities.add({
        polygon: {
          hierarchy: polygonHierarchy(poly),
          material: color.withAlpha(0.35),
          classificationType: Cesium.ClassificationType.TERRAIN
        }
      }));
      // 外环描边，便于看清边界
      isoEntities.push(viewer.entities.add({
        polyline: {
          positions: ringPositions(poly[0]),
          width: 3,
          clampToGround: true,
          material: color
        }
      }));
    });

    poly0(polygons, c => {
      west = Math.min(west, toMapCoord(c[1], c[0])[1]); east = Math.max(east, toMapCoord(c[1], c[0])[1]);
      south = Math.min(south, toMapCoord(c[1], c[0])[0]); north = Math.max(north, toMapCoord(c[1], c[0])[0]);
    });

    const props = f.properties || {};
    const value = props.value;
    const label = value == null ? '' : (rangeType === 'time' ? formatDuration(value) : (value >= 1000 ? (value / 1000).toFixed(1) + ' km' : value + ' m'));
    if (props.center && i === maxIdx) {
      const c = props.center;
      isoEntities.push(pointEntity(c[1], c[0], color, label));
    }
  });

  if (west < east && south < north) zoomToRect(west, south, east, north);

  const count = features.length;
  const vehicleText = isoVehicleEl.options[isoVehicleEl.selectedIndex].text;
  const areaMax = features.reduce((m, f) => Math.max(m, Number(f.properties && f.properties.area) || 0), 0);
  const areaText = isoAttrAreaEl.checked && areaMax > 0
    ? `，外圈面积 ${areaMax >= 1e6 ? (areaMax / 1e6).toFixed(2) + ' km²' : Math.round(areaMax) + ' m²'}`
    : '';
  const dirText = isoLocationTypeEl.value === 'start' ? '出发可达' : '到达可达';
  const rangeText = ranges.map(v => rangeType === 'time'
    ? formatDuration(v)
    : (v >= 1000 ? (v / 1000).toFixed(1) + ' km' : v + ' m')).join(' / ');
  isoResultEl.style.display = 'block';
  isoResultEl.innerHTML =
    `<div class="big">${count} 个等时圈</div>` +
    `<div style="color:#555;margin-top:4px">${vehicleText}（${isoVehicleEl.value}）· ${dirText} · ${rangeType === 'time' ? '时间' : '距离'} ${rangeText}${areaText}，` +
    `多边形 ${features.reduce((n, f) => n + ((f.geometry.type === 'MultiPolygon') ? f.geometry.coordinates.length : 1), 0)} 个</div>`;
}

function poly0(polygons, fn) {
  if (!polygons.length) return;
  polygons[0][0].forEach(fn);
}

function formatDuration(seconds) {
  const t = Math.round(seconds);
  const h = Math.floor(t / 3600);
  const m = Math.round((t % 3600) / 60);
  return h > 0 ? `${h} 小时 ${m} 分` : `${m} 分`;
}

// ---------- tab 切换 ----------
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-route').style.display = tab === 'route' ? '' : 'none';
  document.getElementById('tab-iso').style.display = tab === 'iso' ? '' : 'none';
  document.getElementById('tab-offroad').style.display = tab === 'offroad' ? '' : 'none';
  document.getElementById('tab-hybrid').style.display = tab === 'hybrid' ? '' : 'none';
  // 地形坡度在越野路径页与混合页都需要，其他页面用椭球体
  applyTerrainForTab(tab);
  // 越野/混合页默认使用卫星影像底图；切回其他 tab 时恢复高德路网
  if (tab === 'offroad' || tab === 'hybrid') {
    if (basemapEl.value === 'amap') {
      basemapEl.value = 'amap-img';
      setBaseLayer('amap-img');
    }
  } else if (basemapEl.value === 'amap-img') {
    basemapEl.value = 'amap';
    setBaseLayer('amap');
  }
  hintEl.innerHTML = tab === 'route'
    ? '在地名检索框输入起点/途经点/终点，或点击地球依次选点（槽位填满后再次点击重新开始）。<br />检索服务地址默认 http://localhost:8088/，可自行修改。<br />台湾测试范围约：经度 121.45~121.65，纬度 24.95~25.10。'
    : tab === 'iso'
      ? '点击地球选等时线中心点；再点一次会以新点重新计算。<br />范围值支持多级，用逗号分隔（最多 5 级），如 300,600,900。'
      : tab === 'offroad'
        ? '按网格坡度计算可直接通行的越野路径，自动使用卫星影像底图并显示高程剖面。<br />点击选起点，再点一次选终点；网格间距越小越精细，但计算越慢。可调整坡度阈值、障碍显示与地形起伏，结果支持导出 GPX/GeoJSON。'
        : '公路+越野混合：网格落在公路上时按路网速度计算，否则按越野速度并结合坡度衰减（上坡更慢、下坡仅适度减速），公路优先系数越大越倾向走公路。<br />点击选起点，再点一次选终点；结果给出分段明细。';
  clearOverlays();
}

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// ---------- 交互绑定 ----------
if (viewer) {
  const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  handler.setInputAction((movement) => {
    const cartesian = pickGlobe(movement.position);
    if (!cartesian) return;
    const carto = Cesium.Cartographic.fromCartesian(cartesian);
    const wgs = toWgsCoord(Cesium.Math.toDegrees(carto.latitude), Cesium.Math.toDegrees(carto.longitude));

    // 绘制避让区域 / 业务围栏时不添加路线点
    if (drawMode && activeTab === 'route') { finishDraw(wgs); return; }

    if (activeTab === 'route') {
      // 优先填充第一个空槽位（起点 → 途经点 → 终点）；全部填满时重新从起点开始
      let slot = routeSlots.find(s => !s.point);
      if (!slot) {
        removeEntities(routeEntities);
        routePoints = [];
        resetRouteSlots(null, null);
        routeResultEl.style.display = 'none';
        clearError();
        slot = routeSlots[0];
      }
      slot.point = [wgs[0], wgs[1]];
      slot.text = `${wgs[0].toFixed(5)}, ${wgs[1].toFixed(5)}`;
      refreshRoutePointsFromSlots();
      renderSearchRows();
      renderRouteMarkers();
      if (routePoints.length >= 2) computeRoute();
    } else if (activeTab === 'iso') {
      isoCenter = [wgs[0], wgs[1]];
      renderIsoCenter();
      computeIsochrone();
    } else if (activeTab === 'offroad') {
      if (offroadPoints.length >= 2) {
        offroadPoints = [];
        removeEntities(offroadShapes);
        removeEntities(offroadBarriers);
        removeOffroadHoverMarker();
        offroadResultEl.style.display = 'none';
        offroadActionsEl.style.display = 'none';
        clearError();
      }
      offroadPoints.push([wgs[0], wgs[1]]);
      renderOffroadMarkers();
      if (offroadPoints.length === 2) computeOffroad();
    } else if (activeTab === 'hybrid') {
      if (hybridPoints.length >= 2) {
        hybridPoints = [];
        removeEntities(hybridShapes);
        hybridResultEl.style.display = 'none';
        hybridActionsEl.style.display = 'none';
        clearError();
      }
      hybridPoints.push([wgs[0], wgs[1]]);
      renderHybridMarkers();
      if (hybridPoints.length === 2) computeHybrid();
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  setBaseLayer(basemapEl.value);

  basemapEl.addEventListener('change', () => {
    setBaseLayer(basemapEl.value);
    renderRouteMarkers();
    renderIsoCenter();
    renderOffroadMarkers();
    renderHybridMarkers();
    if (activeTab === 'route' && routePoints.length >= 2) computeRoute();
    if (activeTab === 'iso' && isoCenter) computeIsochrone();
    if (activeTab === 'offroad' && offroadPoints.length === 2) computeOffroad();
    if (activeTab === 'hybrid' && hybridPoints.length === 2) computeHybrid();
  });
  gcjToggle.addEventListener('change', () => {
    renderRouteMarkers();
    renderIsoCenter();
    renderOffroadMarkers();
    renderHybridMarkers();
    renderAvoidZonesAndFence();
    if (activeTab === 'route' && routePoints.length >= 2) computeRoute();
    if (activeTab === 'iso' && isoCenter) computeIsochrone();
    if (activeTab === 'offroad' && offroadPoints.length === 2) computeOffroad();
    if (activeTab === 'hybrid' && hybridPoints.length === 2) computeHybrid();
  });
  prefEl.addEventListener('change', () => { if (activeTab === 'route' && routePoints.length >= 2) computeRoute(); });
  routeVehicleEl.addEventListener('change', () => { updateRouteOptionAvailability(); routeRecompute(); });
  updateRouteOptionAvailability();
  vehicleTypeEl.addEventListener('change', routeRecompute);
  [restrictHeightEl, restrictWidthEl, restrictWeightEl, restrictAxleloadEl, restrictHazmatEl,
    avoidHighwaysEl, avoidTollwaysEl, avoidFerriesEl].forEach(el => el.addEventListener('change', routeRecompute));
  drawAvoidEl.addEventListener('click', () => startDraw('avoid'));
  clearAvoidEl.addEventListener('click', () => { clearAvoidZones(); if (routePoints.length >= 2) computeRoute(); });
  drawGeofenceEl.addEventListener('click', () => startDraw('geofence'));
  clearGeofenceEl.addEventListener('click', () => { clearGeofence(); if (routePoints.length >= 2) computeRoute(); });
  isoVehicleEl.addEventListener('change', () => { updateIsoOptionAvailability(); if (activeTab === 'iso' && isoCenter) computeIsochrone(); });
  updateIsoOptionAvailability();
  isoLocationTypeEl.addEventListener('change', () => { if (activeTab === 'iso' && isoCenter) computeIsochrone(); });
  isoAttrAreaEl.addEventListener('change', () => { if (activeTab === 'iso' && isoCenter) computeIsochrone(); });
  [isoAvoidHighwaysEl, isoAvoidTollwaysEl, isoAvoidFerriesEl].forEach(el =>
    el.addEventListener('change', () => { if (activeTab === 'iso' && isoCenter) computeIsochrone(); }));
  rangeTypeEl.addEventListener('change', () => { if (activeTab === 'iso' && isoCenter) computeIsochrone(); });
  rangeValueEl.addEventListener('change', () => { if (activeTab === 'iso' && isoCenter) computeIsochrone(); });
  offroadGridEl.addEventListener('change', () => { if (activeTab === 'offroad' && offroadPoints.length === 2) computeOffroad(); });
  offroadMaxSlopeEl.addEventListener('change', () => { if (activeTab === 'offroad' && offroadPoints.length === 2) computeOffroad(); });
  offroadVehicleEl.addEventListener('change', () => { if (activeTab === 'offroad' && offroadPoints.length === 2) computeOffroad(); });
  // 障碍显隐只切换实体可见性，不触发重新计算
  offroadShowBarrierEl.addEventListener('change', () => {
    const visible = offroadShowBarrierEl.checked;
    offroadBarriers.forEach(e => { e.show = visible; });
  });
  offroadExagEl.addEventListener('input', () => setVerticalExaggeration(Number(offroadExagEl.value)));
  // 混合页参数变化时，若已有起终点则重新计算
  [hybridGridEl, hybridMaxSlopeEl, hybridSpeedEl, hybridPenaltyEl, hybridProfileEl].forEach(el =>
    el.addEventListener('change', () => { if (activeTab === 'hybrid' && hybridPoints.length === 2) computeHybrid(); }));
  hybridCancelEl.addEventListener('click', () => {
    if (hybridAbort) { hybridAbort.abort(); hybridAbort = null; }
    loadingEl.textContent = '计算中…';
    loadingEl.style.display = 'none';
    hybridCancelEl.style.display = 'none';
    hybridActionsEl.style.display = hybridData ? 'flex' : 'none';
  });
  offroadCancelEl.addEventListener('click', () => {
    if (offroadAbort) { offroadAbort.abort(); offroadAbort = null; }
    loadingEl.textContent = '计算中…';
    loadingEl.style.display = 'none';
    offroadCancelEl.style.display = 'none';
    offroadActionsEl.style.display = offroadData ? 'flex' : 'none';
  });
  offroadGpxEl.addEventListener('click', () => {
    if (!offroadData || !offroadData.geometry) { showError('暂无越野路径结果可导出'); return; }
    downloadText(offroadFileName('gpx'), buildGpx(offroadData), 'application/gpx+xml');
  });
  offroadGeoJsonEl.addEventListener('click', () => {
    if (!offroadData || !offroadData.geometry) { showError('暂无越野路径结果可导出'); return; }
    downloadText(offroadFileName('geojson'), buildGeoJson(offroadData), 'application/geo+json');
  });

  document.getElementById('clear').addEventListener('click', clearOverlays);
  document.getElementById('demo').addEventListener('click', () => {
    if (activeTab === 'route') {
      removeEntities(routeEntities);
      resetRouteSlots([25.047764, 121.517089], [25.033977, 121.564565]);
      renderRouteMarkers();
      computeRoute();
    } else if (activeTab === 'iso') {
      isoCenter = [25.047764, 121.517089];
      renderIsoCenter();
      computeIsochrone();
    } else if (activeTab === 'offroad') {
      removeEntities(offroadShapes);
      removeEntities(offroadBarriers);
      offroadPoints = [[25.047764, 121.517089], [25.026994, 121.572668]];
      renderOffroadMarkers();
      computeOffroad();
    } else {
      removeEntities(hybridShapes);
      hybridPoints = [[25.047764, 121.517089], [25.026994, 121.572668]];
      renderHybridMarkers();
      computeHybrid();
    }
  });
}

window.addEventListener('error', (e) => showError('页面脚本错误：' + (e.message || e.error)));

switchTab('route');
</script>
</body>
</html>
