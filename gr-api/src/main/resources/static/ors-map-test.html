<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ORS 本地地图测试页</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000; width: 320px;
    background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.18);
    padding: 12px 14px; font-size: 13px; color: #222;
  }
  .panel h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .row label { flex: 0 0 62px; color: #555; }
  input[type=text], select {
    flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
  }
  button {
    padding: 5px 10px; border: 1px solid #2f6fdb; background: #2f6fdb; color: #fff;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button.secondary { background: #fff; color: #2f6fdb; }
  button:disabled { opacity: .5; cursor: default; }
  #hint { color: #777; margin-top: 8px; line-height: 1.5; }
  #result { margin-top: 8px; padding: 8px; background: #f5f7fb; border-radius: 6px; display: none; }
  #result .big { font-size: 16px; font-weight: 600; color: #1a4fa0; }
  #error { margin-top: 8px; color: #b3261e; display: none; white-space: pre-wrap; }
  .pts { color: #444; margin-top: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>ORS 本地地图测试</h1>
  <div class="row">
    <label>服务地址</label>
    <input type="text" id="base" value="http://localhost:8082/ors" />
  </div>
  <div class="row">
    <label>profile</label>
    <input type="text" id="profile" value="driving-car" />
  </div>
  <div class="row">
    <label>偏好</label>
    <select id="preference">
      <option value="recommended">recommended</option>
      <option value="fastest" selected>fastest</option>
      <option value="shortest">shortest</option>
    </select>
  </div>
  <div class="row">
    <label>纠偏</label>
    <label style="flex:0 0 auto; color:#222">
      <input type="checkbox" id="gcj" checked /> 高德 GCJ-02（WGS84 与瓦片之间转换）
    </label>
  </div>
  <div class="row">
    <button id="clear" class="secondary">清空</button>
    <span id="loading" style="display:none;color:#777">计算中…</span>
  </div>
  <div class="pts" id="pts">起点/终点：点击地图选点</div>
  <div id="result"></div>
  <div id="error"></div>
  <div id="hint">
    在该页面上先点起点、再点终点（第三次点击会重新开始）。<br />
    苏州测试范围约：经度 120.67~120.78，纬度 31.26~31.34。
  </div>
</div>

<script>
// ---------- 高德 GCJ-02 与 WGS84 互转（ORS 数据是 WGS84，高德瓦片是 GCJ-02） ----------
const PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;

function outOfChina(lat, lng) {
  return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
}
function transformLat(x, y) {
  let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLng(x, y) {
  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
  return ret;
}
function wgs84ToGcj02(lat, lng) {
  if (outOfChina(lat, lng)) return [lat, lng];
  let dLat = transformLat(lng - 105.0, lat - 35.0);
  let dLng = transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * PI;
  let magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
  return [lat + dLat, lng + dLng];
}
function gcj02ToWgs84(lat, lng) {
  if (outOfChina(lat, lng)) return [lat, lng];
  let wgsLat = lat, wgsLng = lng;
  for (let i = 0; i < 5; i++) {
    const g = wgs84ToGcj02(wgsLat, wgsLng);
    wgsLat -= g[0] - lat;
    wgsLng -= g[1] - lng;
  }
  return [wgsLat, wgsLng];
}

// ---------- ORS 编码 polyline 解码（precision=5） ----------
function decodePolyline(str, precision) {
  const factor = Math.pow(10, precision || 5);
  let index = 0, lat = 0, lng = 0;
  const coordinates = [];
  while (index < str.length) {
    let byte = 0, shift = 0, result = 0;
    do {
      byte = str.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);

    shift = 0; result = 0;
    do {
      byte = str.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);

    coordinates.push([lat / factor, lng / factor]); // [lat, lng]
  }
  return coordinates;
}

// ---------- 地图 ----------
const map = L.map('map', { center: [31.30, 120.70], zoom: 13 });
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1', '2', '3', '4'],
  maxZoom: 18,
  attribution: '&copy; 高德地图'
}).addTo(map);

const gcjToggle = document.getElementById('gcj');
const toMapCoord = (lat, lng) => gcjToggle.checked ? wgs84ToGcj02(lat, lng) : [lat, lng];
const toWgsCoord = (lat, lng) => gcjToggle.checked ? gcj02ToWgs84(lat, lng) : [lat, lng];

const markers = [];
let routeLine = null;
let points = []; // WGS84 [lat, lng]

const ptsEl = document.getElementById('pts');
const resultEl = document.getElementById('result');
const errorEl = document.getElementById('error');
const loadingEl = document.getElementById('loading');

function showError(msg) {
  errorEl.style.display = 'block';
  errorEl.textContent = msg;
}
function clearError() {
  errorEl.style.display = 'none';
  errorEl.textContent = '';
}

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers.length = 0;
  points.forEach((p, i) => {
    const c = toMapCoord(p[0], p[1]);
    markers.push(L.marker(c).addTo(map).bindTooltip(i === 0 ? '起点' : '终点'));
  });
  ptsEl.textContent = points.length
    ? points.map((p, i) => `${i === 0 ? '起点' : '终点'} WGS84: ${p[0].toFixed(5)}, ${p[1].toFixed(5)}`).join('\n')
    : '起点/终点：点击地图选点';
}

function resetRoute() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  resultEl.style.display = 'none';
  clearError();
}

function clearAll() {
  points = [];
  renderMarkers();
  resetRoute();
}

map.on('click', (e) => {
  if (points.length >= 2) clearAll();
  const wgs = toWgsCoord(e.latlng.lat, e.latlng.lng);
  points.push([wgs[0], wgs[1]]);
  renderMarkers();
  if (points.length === 2) computeRoute();
});

async function computeRoute() {
  const base = document.getElementById('base').value.replace(/\/+$/, '');
  const profile = document.getElementById('profile').value.trim();
  const preference = document.getElementById('preference').value;
  const body = {
    coordinates: points.map(p => [p[1], p[0]]), // ORS 需要 [lon, lat]
    preference: preference,
    instructions: true
  };

  loadingEl.style.display = 'inline';
  resetRoute();
  try {
    const resp = await fetch(`${base}/v2/directions/${encodeURIComponent(profile)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) {
      showError('HTTP ' + resp.status + '\n' + JSON.stringify(data, null, 2));
      return;
    }
    drawResult(data);
  } catch (err) {
    showError('请求失败：' + err.message + '\n（确认服务已启动、地址正确，且允许跨域）');
  } finally {
    loadingEl.style.display = 'none';
  }
}

function drawResult(data) {
  // ORS v2 默认返回 {metadata, routes, bbox}，routes[0].geometry 是 encoded polyline 字符串；
  // 这里同时兼容 GeoJSON FeatureCollection 形状。
  let coords = [];
  let summary = {};

  if (Array.isArray(data.routes) && data.routes.length) {
    const route = data.routes[0];
    summary = route.summary || {};
    const geom = route.geometry;
    coords = typeof geom === 'string'
      ? decodePolyline(geom, 5)
      : ((geom && geom.coordinates) || []).map(c => [c[1], c[0]]);
  } else if (data.features && data.features[0]) {
    const feature = data.features[0];
    summary = (feature.properties && feature.properties.summary) || {};
    const geom = feature.geometry;
    coords = typeof geom === 'string'
      ? decodePolyline(geom, 5)
      : ((geom && geom.coordinates) || []).map(c => [c[1], c[0]]);
  }

  if (!coords.length) { showError('未解析到路线几何数据：\n' + JSON.stringify(data).slice(0, 800)); return; }

  const mapCoords = coords.map(c => toMapCoord(c[0], c[1]));
  routeLine = L.polyline(mapCoords, { color: '#1a73e8', weight: 5, opacity: 0.9 }).addTo(map);
  map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

  const s = summary;
  const dist = s.distance != null ? (s.distance / 1000).toFixed(2) + ' km' : '-';
  const dur = s.duration != null ? formatDuration(s.duration) : '-';
  resultEl.style.display = 'block';
  resultEl.innerHTML =
    `<div class="big">${dist} · ${dur}</div>` +
    `<div style="color:#555;margin-top:4px">preference=${document.getElementById('preference').value}` +
    `，点 ${coords.length} 个</div>`;
}

function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.round((seconds % 3600) / 60);
  return h > 0 ? `${h} 小时 ${m} 分` : `${m} 分`;
}

document.getElementById('clear').addEventListener('click', clearAll);
gcjToggle.addEventListener('change', () => { renderMarkers(); });
document.getElementById('preference').addEventListener('change', () => {
  if (points.length === 2) computeRoute();
});
</script>
</body>
</html>
